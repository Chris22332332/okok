services:
  - type: web
    name: portal-browser-v13-2
    runtime: node
    plan: free
    buildCommand: npm install && npm test && npm run preflight
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_ACCESS_PASSWORD
        sync: false
      - key: PORTAL_SESSION_SECRET
        generateValue: true
